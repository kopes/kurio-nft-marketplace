    <title>Kurio — Marketplace de NFTs</title>
    <!--
      O app shell usa classes do Tailwind: fica oculto até a folha de estilos ser aplicada (no dev, ela chega via JS).
      O anel de carregamento (.app-loader) é definido só aqui, inline, porque precisa aparecer antes de qualquer CSS;
      o React reutiliza as mesmas classes no carregamento de rotas (PagePending). Ele só surge após 300 ms,
      para não piscar quando a aplicação monta rápido, e vira um pulso de opacidade com movimento reduzido.
    -->
    <style>
      html { background: #140d0a; }
      .app-shell { visibility: hidden; }
      .app-loader { opacity: 0; animation: app-loader-in 0.2s ease-out 0.3s forwards; }
      .app-loader--fixed { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
      .app-loader__ring { display: block; width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%; border: 3px solid #3f2319; border-top-color: #d28a4c; animation: app-loader-spin 0.8s linear infinite; }
      .app-loader__label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      @keyframes app-loader-in { to { opacity: 1; } }
      @keyframes app-loader-spin { to { transform: rotate(360deg); } }
      @keyframes app-loader-pulse { 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) {
        .app-loader__ring { border-color: #d28a4c; animation: app-loader-pulse 1.6s ease-in-out infinite; }
      }
    </style>
